#
# Configuración de Pages CMS (https://pagescms.org) para Angels & Demons Nails.
#
# IMPORTANTE: cada clave declarada aquí debe existir en los esquemas Zod de
# src/lib/esquemas.ts, y viceversa — lo comprueba tests/pages-cms.test.ts.
# Pages CMS borra al guardar cualquier clave del JSON que no esté declarada
# en `fields`, así que un desajuste aquí provoca pérdida silenciosa de datos.
#
# Nota sobre fotos: el campo `image` de Pages CMS solo admite UNA fuente de
# medios por campo (options.media es un string, no una lista — verificado en
# https://pagescms.org/docs/configuration/fields/image/). Por eso se usa una
# única fuente "fotos" que sirve a la vez para las fotos ya curadas del
# repositorio (src/assets/fotos) y para las fotos nuevas que suba la dueña:
# así cualquier campo de imagen puede tanto elegir una foto existente como
# subir una nueva desde el mismo selector, sin el riesgo (no documentado)
# de que Pages CMS trate de forma rara una ruta que apunta fuera de la
# fuente de medios configurada.
#

media:
  - name: fotos
    label: Fotos del salón
    input: src/assets/fotos
    output: src/assets/fotos
    rename: safe
    extensions: [jpg, jpeg, png, webp]

content:
  - name: servicios
    label: Servicios y precios
    type: file
    path: src/data/servicios.json
    format: json
    fields:
      - name: categorias
        label: Categorías
        type: object
        list: { min: 1 }
        fields:
          - { name: id, label: Identificador, type: string, required: true, pattern: { regex: "^[a-z0-9-]+$", message: "Solo minúsculas, números y guiones (p. ej. unas-gel)" }, description: "Identificador interno de la categoría (se usa en enlaces internos). Al crear una categoría nueva, escribe uno en minúsculas sin espacios." }
          - { name: nombre, label: Nombre, type: string, required: true, options: { maxlength: 60 } }
          - { name: lado, label: "Lado (Angel/Demon)", type: select, options: { values: [angel, demon] }, description: "(no se muestra todavía en la web)" }
          - name: servicios
            label: Servicios de la categoría
            type: object
            list: { min: 1, collapsible: { summary: "{fields.nombre} — {fields.precio} €" } }
            fields:
              - { name: nombre, label: Nombre del servicio, type: string, required: true, options: { maxlength: 120 } }
              - { name: precio, label: "Precio (€)", type: number, required: true, options: { min: 0, max: 1000 }, description: "Usa como mucho 2 decimales, p. ej. 18.90." }
              - { name: min, label: "Duración (minutos)", type: number, required: true, options: { min: 1, max: 600 } }
              - { name: pagina, label: "Página de servicio asociada", type: select, options: { values: [manicura-rusa, semipermanente, acrilicas, pedicura, diseno] } }
              - { name: popular, label: "Destacar en portada", type: boolean }
              - { name: desde, label: "Mostrar como 'desde'", type: boolean }
              - { name: nota, label: Nota, type: text, options: { maxlength: 300 } }

  - name: paginas-servicio
    label: Páginas de servicio
    type: file
    path: src/data/paginas-servicio.json
    format: json
    list: true
    fields:
      - { name: slug, label: Identificador de la página, type: select, required: true, readonly: true, options: { values: [manicura-rusa, semipermanente, acrilicas, pedicura, diseno] } }
      - { name: nombre, label: Título, type: string, required: true, options: { maxlength: 60 } }
      - { name: descripcion, label: Descripción, type: text, options: { maxlength: 2000 } }
      - { name: foto, label: Foto de portada de la página, type: image, options: { media: fotos } }

  - name: looks
    label: Galería de looks
    type: file
    path: src/data/looks.json
    format: json
    list: true
    fields:
      - { name: titulo, label: Título del look, type: string, required: true, options: { maxlength: 40 } }
      - { name: tecnica, label: Técnica, type: string, required: true, options: { maxlength: 30 } }
      - { name: lado, label: "Lado (Angel/Demon)", type: select, required: true, options: { values: [angel, demon] } }
      - { name: foto, label: Foto, type: image, required: true, options: { media: fotos } }
      - { name: alt, label: "Texto alternativo (accesibilidad)", type: string, required: true, options: { maxlength: 160 }, description: "Describe la imagen para personas que usan lector de pantalla." }
      - { name: pagina, label: "Página de servicio asociada", type: select, options: { values: [manicura-rusa, semipermanente, acrilicas, pedicura, diseno] } }

  - name: equipo
    label: Equipo
    type: file
    path: src/data/equipo.json
    format: json
    list: true
    fields:
      - { name: nombre, label: Nombre, type: string, required: true, options: { maxlength: 40 } }
      - { name: permisoFoto, label: "Permiso para publicar su foto", type: boolean, description: "Solo si la profesional ha dado permiso por escrito" }
      - { name: foto, label: Foto, type: image, options: { media: fotos } }
      - { name: especialidad, label: Especialidad, type: text, options: { maxlength: 120 } }

  - name: resenas
    label: Reseñas
    type: file
    path: src/data/resenas.json
    format: json
    list: true
    fields:
      - { name: texto, label: "Texto de la reseña", type: text, required: true, options: { maxlength: 600 }, description: "Pega el texto literal de Booksy, sin retocar." }
      - { name: autora, label: Nombre de la clienta, type: string, required: true, options: { maxlength: 40 } }
      - { name: profesional, label: Profesional mencionada, type: string, options: { maxlength: 40 } }
      - { name: servicio, label: Servicio realizado, type: string, options: { maxlength: 120 } }
      - { name: fecha, label: Fecha de la reseña, type: date }

  - name: faq
    label: Preguntas frecuentes
    type: file
    path: src/data/faq.json
    format: json
    list: true
    fields:
      - { name: pregunta, label: Pregunta, type: string, required: true, options: { maxlength: 160 } }
      - { name: respuesta, label: Respuesta, type: text, required: true, options: { maxlength: 1200 } }
      - { name: pagina, label: "Página de servicio asociada", type: select, options: { values: [manicura-rusa, semipermanente, acrilicas, pedicura, diseno] } }

  - name: portada
    label: Portada
    type: file
    path: src/data/portada.json
    format: json
    fields:
      - { name: eyebrow, label: "Texto pequeño encima del titular", type: string, required: true, options: { maxlength: 80 } }
      - name: titular
        label: Titular
        type: object
        fields:
          - { name: linea1, label: "Línea 1", type: string, required: true, options: { maxlength: 40 } }
          - { name: clave1, label: "Palabra clave 1 (destacada)", type: string, required: true, options: { maxlength: 20 } }
          - { name: linea2, label: "Línea 2", type: string, required: true, options: { maxlength: 40 } }
          - { name: clave2, label: "Palabra clave 2 (destacada)", type: string, required: true, options: { maxlength: 20 } }
      - { name: entradilla, label: Entradilla, type: text, required: true, options: { maxlength: 300 } }
      - name: hero
        label: "Fotos principales (Angel / Demon)"
        type: object
        fields:
          - name: angel
            label: Foto del lado Angel
            type: object
            fields:
              - { name: foto, label: Foto, type: image, required: true, options: { media: fotos } }
              - { name: alt, label: "Texto alternativo (accesibilidad)", type: string, required: true, options: { maxlength: 160 } }
              - { name: pie, label: "Pie de foto", type: string, required: true, options: { maxlength: 60 } }
          - name: demon
            label: Foto del lado Demon
            type: object
            fields:
              - { name: foto, label: Foto, type: image, required: true, options: { media: fotos } }
              - { name: alt, label: "Texto alternativo (accesibilidad)", type: string, required: true, options: { maxlength: 160 } }
              - { name: pie, label: "Pie de foto", type: string, required: true, options: { maxlength: 60 } }

  - name: negocio
    label: Datos del negocio
    type: file
    path: src/data/negocio.json
    format: json
    fields:
      - { name: nombre, label: Nombre comercial, type: string, required: true, options: { maxlength: 80 } }
      - { name: razonSocial, label: Razón social, type: string, required: true, options: { maxlength: 120 } }
      - name: direccion
        label: Dirección
        type: object
        fields:
          - { name: calle, label: Calle y número, type: string, required: true, options: { maxlength: 120 } }
          - { name: cp, label: Código postal, type: string, required: true, pattern: { regex: "^\\d{5}$", message: "Debe tener 5 dígitos" } }
          - { name: ciudad, label: Ciudad, type: string, required: true, options: { maxlength: 80 } }
          - { name: provincia, label: Provincia, type: string, required: true, options: { maxlength: 80 } }
          - { name: pais, label: País, type: string, required: true, readonly: true, pattern: { regex: "^ES$", message: "Solo se admite España (ES)" } }
      - { name: telefono, label: "Teléfono (formato internacional)", type: string, required: true, pattern: { regex: "^\\+34\\d{9}$", message: "Formato: +34 seguido de 9 dígitos, sin espacios" }, description: "Se usa para el enlace de llamada y el JSON-LD." }
      - { name: telefonoTexto, label: "Teléfono (texto para mostrar)", type: string, required: true, pattern: { regex: "^\\d{3} \\d{3} \\d{3}$", message: "Formato: 672 782 329" } }
      - name: horario
        label: Horario
        type: object
        list: { min: 1, collapsible: { summary: "{fields.dias}" } }
        fields:
          - { name: dias, label: "Días (p. ej. «Lunes a sábado»)", type: string, required: true, options: { maxlength: 40 } }
          - { name: abre, label: "Hora de apertura (HH:MM)", type: string, pattern: { regex: "^\\d{2}:\\d{2}$", message: "Formato: 09:30" } }
          - { name: cierra, label: "Hora de cierre (HH:MM)", type: string, pattern: { regex: "^\\d{2}:\\d{2}$", message: "Formato: 21:00" } }
          - { name: cerrado, label: "Cerrado ese día", type: boolean }
      - name: booksy
        label: Booksy
        type: object
        fields:
          - { name: url, label: "Enlace de reserva de Booksy", type: string, required: true, pattern: { regex: "^https://([a-z0-9-]+\\.)?booksy\\.com/", message: "Debe ser un enlace de booksy.com" } }
      - { name: instagram, label: "Usuario de Instagram (sin @)", type: string, required: true, pattern: { regex: "^[A-Za-z0-9._]{1,30}$", message: "Solo letras, números, puntos y guiones bajos" } }
      - name: valoracion
        label: Valoración de Booksy
        description: "La web la lee sola de Booksy cuatro veces al día. Estos datos solo se usan si Booksy no responde: no hace falta tocarlos."
        type: object
        fields:
          - { name: media, label: "Media (0 a 5)", type: number, required: true, options: { min: 0, max: 5 }, description: "Copia la valoración media que muestra Booksy." }
          - { name: total, label: "Número total de reseñas", type: number, required: true, options: { min: 0 } }
          - { name: fecha, label: "Fecha de la última actualización", type: date, required: true }
      - name: comodidades
        label: Comodidades del salón
        type: string
        list: true
        options: { maxlength: 60 }
      - name: legal
        label: "Datos legales (opcionales)"
        type: object
        fields:
          - { name: nif, label: NIF/CIF, type: string, options: { maxlength: 20 } }
          - { name: email, label: "Email de contacto legal", type: string, pattern: { regex: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$", message: "Debe ser un email válido" } }
          - { name: registro, label: "Datos de registro mercantil", type: text, options: { maxlength: 300 } }
